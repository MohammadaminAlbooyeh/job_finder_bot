services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    volumes:
      - backend_data:/app/data
    environment:
      - OUTPUT_PATH=/app/data/jobs_output.json
      - PERSISTENCE=csv
      - PERSISTENCE_CSV_PATH=/app/data/jobs_output.csv
      - PERSISTENCE_HTML_PATH=/app/data/jobs_output.html
      - STATE_PATH=/app/data/seen_jobs.json
      - HISTORY_PATH=/app/data/run_history.json

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  backend_data:
